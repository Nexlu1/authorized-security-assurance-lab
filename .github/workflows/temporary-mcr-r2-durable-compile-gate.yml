name: Temporary MCR R2 durable compile gate

on:
  push:
    branches:
      - temporary/mcr-r2-durable-compile-gate-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Reconstruct and verify exact durable R2 source
        run: python qualification/mcr-r2-durable/reconstruct_r2.py
      - name: Apply bounded candidate dependency repair
        run: python qualification/mcr-r2-durable/apply_candidate_repair.py
      - name: Apply stack-safety runtime repair
        run: python qualification/mcr-r2-durable/apply_runtime_repair.py
      - name: Apply fixture-coverage and PDF-encryption repair
        run: python qualification/mcr-r2-durable/apply_coverage_expansion.py
      - name: Apply R2.1 OOXML/text fixture test expansion
        run: python qualification/mcr-r2-durable/apply_fixture_r21_tests.py
      - name: Apply R2.2 mail/PDF expansion and pdfcpu compatibility repair
        run: python qualification/mcr-r2-durable/apply_r22_expansion.py
      - name: Apply bounded R2.2 compile correction
        run: python qualification/mcr-r2-durable/apply_r22_compile_fix.py
      - name: Apply R2.3 mail warning/PDF damaged-state expansion
        run: python qualification/mcr-r2-durable/apply_r23_expansion.py
      - name: Apply bounded R2.3 strict-Clippy correction
        run: python qualification/mcr-r2-durable/apply_r23_clippy_fix.py
      - name: Normalize extracted working copy with rustfmt
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo fmt
      - name: Formatting gate after recorded normalization
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo fmt --check
      - name: Generate dependency lock
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo generate-lockfile
      - name: Prove repaired rusqlite version is locked
        shell: bash
        run: cd "$MCR_R2_SRC" && grep -A3 'name = "rusqlite"' Cargo.lock | grep 'version = "0.40.2"'
      - name: Strict Clippy
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo clippy --locked --all-targets -- -D warnings
      - name: Compile every test target without executing fixture-dependent tests
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo test --locked --all-targets --no-run
      - name: Release build
        shell: bash
        run: cd "$MCR_R2_SRC" && cargo build --locked --release
      - name: Write build receipt
        run: python qualification/mcr-r2-durable/write_compile_receipt.py
      - name: Package exact promotable R2.3 source
        if: matrix.os == 'ubuntu-24.04'
        run: python qualification/mcr-r2-durable/package_promotable_source.py
      - name: Upload compile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r2-durable-compile-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mcr-r2-compile-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload promotable source
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r2-promotable-source-${{ github.sha }}
          path: ${{ runner.temp }}/mcr-r2-promotable-source
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
