name: Temporary MCR Siegfried PRONOM qualification

on:
  push:
    branches:
      - temporary/mcr-siegfried-pronom-qualification-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Qualify exact upstream Siegfried + PRONOM assets
        run: python qualification/siegfried/qualify.py
      - name: Upload qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-siegfried-pronom-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mcr-siegfried-qualification/SIEGFRIED_PRONOM_QUALIFICATION_RECEIPT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
