name: Temporary MCR reproducible packaging qualification

on:
  push:
    branches:
      - temporary/mcr-repro-packaging-qualification-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out synthetic qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build deterministic package twice
        run: python qualification/repro/package_repro.py
      - name: Upload deterministic package and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-repro-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mcr-repro/REPRO_PACKAGING_RECEIPT.json
            ${{ runner.temp }}/mcr-repro/MCR_SYNTHETIC_REPRO_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
