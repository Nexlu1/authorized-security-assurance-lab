name: Temporary MCR verifier R2 regression

on:
  push:
    branches:
      - temporary/mcr-verifier-r2-test-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reproduce R1 defect and prove array repair
        shell: powershell
        run: .\tools\mcr_verifier_list_regression.ps1

      - name: Decode full R2 candidate
        shell: powershell
        run: |
          $encoded = (Get-Content -LiteralPath .\testdata\VERIFY_MCR_FOSS_HARVEST_R2.ps1.gz.b64 -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $memory = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GzipStream($memory, [System.IO.Compression.CompressionMode]::Decompress)
          $output = [System.IO.File]::Create((Join-Path $PWD 'VERIFY_MCR_FOSS_HARVEST_R2.ps1'))
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $memory.Dispose() }

      - name: Parse and self-test R2 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'VERIFY_MCR_FOSS_HARVEST_R2.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List *; throw 'Windows PowerShell parser errors' }
          & .\VERIFY_MCR_FOSS_HARVEST_R2.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "R2 self-test exit $LASTEXITCODE" }

      - name: Parse and self-test R2 under PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'VERIFY_MCR_FOSS_HARVEST_R2.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List *; throw 'PowerShell 7 parser errors' }
          & .\VERIFY_MCR_FOSS_HARVEST_R2.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "R2 self-test exit $LASTEXITCODE" }
