name: Python SAST

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign using Bandit's upstream-pinned action
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.2.2

      - name: Verify upstream Bandit image and resolve immutable digest
        id: bandit_image
        shell: bash
        run: |
          set -euo pipefail
          floating='ghcr.io/pycqa/bandit/bandit:latest'
          docker pull "$floating"

          cosign verify "$floating" \
            --certificate-identity-regexp '^https://github.com/pycqa/bandit/.github/workflows/build-publish-image.yml@refs/(tags/1\.9\.4|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > bandit-signature-verification.json

          image_ref="$(docker image inspect "$floating" --format '{{index .RepoDigests 0}}')"
          test -n "$image_ref"
          printf '%s\n' "$image_ref" | tee bandit-image-digest.txt
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

          docker run --rm "$image_ref" --version | tee bandit-version.txt
          grep -Eq '(^|[[:space:]])1\.9\.4($|[[:space:]])' bandit-version.txt

      - name: Run complete Bandit evidence scan
        env:
          BANDIT_IMAGE: ${{ steps.bandit_image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bandit-out"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/bandit-out:/out" \
            "$BANDIT_IMAGE" \
            -r /src/scripts \
            --ignore-nosec \
            --severity-level all \
            --confidence-level all \
            --format json \
            --output /out/bandit-all.json \
            --exit-zero

      - name: Run Bandit enforcement gate
        id: bandit_gate
        env:
          BANDIT_IMAGE: ${{ steps.bandit_image.outputs.image_ref }}
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/bandit-out:/out" \
            "$BANDIT_IMAGE" \
            -r /src/scripts \
            --ignore-nosec \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output /out/bandit-gate.json
          code=$?
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect Bandit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bandit-evidence
          cp bandit-signature-verification.json bandit-evidence/
          cp bandit-image-digest.txt bandit-evidence/
          cp bandit-version.txt bandit-evidence/
          if test -f "$RUNNER_TEMP/bandit-out/bandit-all.json"; then
            cp "$RUNNER_TEMP/bandit-out/bandit-all.json" bandit-evidence/
          fi
          if test -f "$RUNNER_TEMP/bandit-out/bandit-gate.json"; then
            cp "$RUNNER_TEMP/bandit-out/bandit-gate.json" bandit-evidence/
          fi

      - name: Preserve Bandit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-results
          path: bandit-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Bandit result
        if: always()
        env:
          SCAN_EXIT: ${{ steps.bandit_gate.outputs.exit_code }}
        shell: bash
        run: test "$SCAN_EXIT" = "0"
