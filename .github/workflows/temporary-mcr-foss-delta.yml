name: Temporary MCR FOSS exact-source delta harvest

on:
  push:
    branches:
      - temporary/mcr-foss-delta-r1-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-foss-delta-r1-20260905
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out public synthetic-only harvest controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and verify exact public source delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/temporary_mcr_foss_delta_harvest.py

      - name: Upload controls and output hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-delta-r1-controls
          path: |
            harvest-output/MCR_FOSS_DELTA_R1_CONTROLS.zip
            harvest-output/OUTPUT_SHA256.json
            harvest-output/OUTPUT_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload delta part 00
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-delta-r1-part00
          path: harvest-output/MCR_FOSS_DELTA_R1_PART_00.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload delta part 01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-delta-r1-part01
          path: harvest-output/MCR_FOSS_DELTA_R1_PART_01.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload delta part 02
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-delta-r1-part02
          path: harvest-output/MCR_FOSS_DELTA_R1_PART_02.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload delta part 03
