name: Temporary Minisign release verification

on:
  push:
    branches:
      - temporary/mcr-foss-harvest-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install independent verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          minisign -v

      - name: Download exact upstream Windows package and detached signature
        run: |
          curl --fail --location --retry 4 --output minisign-0.12-win64.zip \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
          curl --fail --location --retry 4 --output minisign-0.12-win64.zip.minisig \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip.minisig

      - name: Verify exact hash and official detached signature
        run: |
          echo '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479  minisign-0.12-win64.zip' | sha256sum --check
          minisign -Vm minisign-0.12-win64.zip \
            -P RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3

      - name: Emit machine-readable receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, platform, subprocess
          p=pathlib.Path('minisign-0.12-win64.zip')
          s=pathlib.Path('minisign-0.12-win64.zip.minisig')
          receipt={
            'schema':'mcr-minisign-upstream-release-verification-v1',
            'component':'jedisct1/minisign',
            'version':'0.12',
            'asset':p.name,
            'asset_bytes':p.stat().st_size,
            'asset_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'signature_asset':s.name,
            'signature_bytes':s.stat().st_size,
            'signature_sha256':hashlib.sha256(s.read_bytes()).hexdigest(),
            'public_key':'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3',
            'verification':'PASS',
            'verifier':subprocess.check_output(['minisign','-v'],stderr=subprocess.STDOUT,text=True).strip(),
            'runner':platform.platform(),
          }
          pathlib.Path('MINISIGN_0_12_WINDOWS_RELEASE_VERIFICATION.json').write_text(json.dumps(receipt,indent=2))
          PY

      - name: Upload verification receipt and detached signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minisign-0-12-windows-release-verification
          path: |
            MINISIGN_0_12_WINDOWS_RELEASE_VERIFICATION.json
            minisign-0.12-win64.zip.minisig
          if-no-files-found: error
          retention-days: 7
