name: Temporary MCR R8 private wrapper shape smoke

on:
  push:
    branches:
      - temporary/mcr-r8-qualified-dependency-smoke-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper-shape:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qualification/mcr-r8-private-wrapper-shape-smoke
    steps:
      - name: Check out synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Generate lock
        run: cargo generate-lockfile
      - name: Prove qualified revision is locked
        shell: bash
        if: runner.os != 'Windows'
        run: grep -F 'git+https://github.com/Nexlu1/authorized-security-assurance-lab?rev=5572c1f6bdec9e7ae41d42116540bc24fc8db9f1#5572c1f6bdec9e7ae41d42116540bc24fc8db9f1' Cargo.lock
      - name: Prove qualified revision is locked on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $lock = Get-Content -LiteralPath Cargo.lock -Raw
          if (-not $lock.Contains('git+https://github.com/Nexlu1/authorized-security-assurance-lab?rev=5572c1f6bdec9e7ae41d42116540bc24fc8db9f1#5572c1f6bdec9e7ae41d42116540bc24fc8db9f1')) { throw 'Qualified source revision is not pinned in Cargo.lock' }
      - name: Formatting
        run: cargo fmt --check
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Execute wrapper-shape tests
        run: cargo test --locked --all-targets --verbose
      - name: Upload exact Cargo.lock
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-private-wrapper-cargo-lock-${{ github.sha }}
          path: qualification/mcr-r8-private-wrapper-shape-smoke/Cargo.lock
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish exact qualified lock branch
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock="$PWD/Cargo.lock"
          tmp="$RUNNER_TEMP/mcr-r8-wrapper-lock-publish"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cd "$tmp"
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$lock" Cargo.lock
          printf '%s\n' '# Qualified lockfile for private MCR wrapper shape' '' 'Generated after Ubuntu/Windows dependency-shape qualification. The locked safety-core revision is 5572c1f6bdec9e7ae41d42116540bc24fc8db9f1.' > README.md
          git add Cargo.lock README.md
          git commit -m "qualified: private wrapper Cargo.lock from run $GITHUB_RUN_ID"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/qualified/mcr-r8-private-wrapper-lock-v1
