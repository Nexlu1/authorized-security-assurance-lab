name: Temporary MCR R59 synthetic court bundle qualification

on:
  push:
    branches:
      - temporary/mcr-r59-court-bundle-qualification-20260908
    paths:
      - 'qualification/mcr-r59-court-bundle/**'
      - '.github/workflows/mcr-court-bundle-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out synthetic-only qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust 1.88 toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Normalize qualification text inputs for identical semantics
        shell: pwsh
        run: |
          $paths = @(
            './qualification/mcr-r59-court-bundle/src/main.rs',
            './qualification/mcr-r59-court-bundle/Invoke-CourtBundleQualification.ps1'
          )
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          }

      - name: Correct lopdf nested outline root count
        shell: pwsh
        run: |
          $path = './qualification/mcr-r59-court-bundle/src/main.rs'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
              if let Some(outline_id) = document.build_outline() {
                  let catalog = document.get_object_mut(catalog_id)?.as_dict_mut()?;
          '@
          $new = @'
              if let Some(outline_id) = document.build_outline() {
                  let section_count = entries.iter().map(|entry| entry.section).collect::<HashSet<_>>().len();
                  let outline_count = entries.len() + section_count;
                  document
                      .get_object_mut(outline_id)?
                      .as_dict_mut()?
                      .set("Count", outline_count as i64);
                  let catalog = document.get_object_mut(catalog_id)?.as_dict_mut()?;
          '@
          $old = $old.Replace("`r`n", "`n")
          $new = $new.Replace("`r`n", "`n")
          if (([regex]::Matches($text, [regex]::Escape($old))).Count -ne 1) {
            throw 'expected exactly one build_outline catalog block'
          }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Run complete synthetic court-bundle qualification
        shell: pwsh
        run: ./qualification/mcr-r59-court-bundle/Invoke-CourtBundleQualification.ps1

      - name: Upload synthetic qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r59-court-bundle-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mcr-court-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
