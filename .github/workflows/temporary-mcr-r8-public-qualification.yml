name: Temporary MCR R8 public qualification

on:
  push:
    branches:
      - temporary/mcr-r8-public-qualification-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-r8-public-qualification-20260905
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qualification/mcr-r8
    steps:
      - name: Check out synthetic-only public qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Pin Rust-supplied LLD and deterministic PE mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $candidates = @(
            (Join-Path $sysroot 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'),
            (Join-Path $sysroot 'bin\rust-lld.exe')
          )
          $linker = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $linker) { throw "Rust-supplied rust-lld.exe not found under $sysroot" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C debuginfo=0 -C link-arg=/DEBUG:NONE -C link-arg=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned linker: $linker"

      - name: Record toolchain
        run: |
          rustc -Vv
          cargo -V

      - name: Formatting gate
        run: cargo fmt --check

      - name: Compile and run all Rust tests
        run: cargo test --locked --all-targets --verbose

      - name: Strict Clippy gate
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --release --verbose

      - name: Bootstrap runtime self-test
        run: cargo run --locked --release -- self-test

      - name: Capture clean rebuild and byte-difference evidence
        run: python tools/check_clean_rebuild.py

      - name: Emit machine-readable qualification receipt
        run: python tools/write_qualification_receipt.py

      - name: Upload Windows executable and forensic rebuild receipts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-focused-${{ matrix.os }}-${{ github.sha }}
          path: |
            qualification/mcr-r8/target/release/mcr-ingest.exe
            qualification/mcr-r8/repro-first-mcr-ingest.exe
            qualification/mcr-r8/repro-second-mcr-ingest.exe
            qualification/mcr-r8/qualification-receipt.json
            qualification/mcr-r8/clean-rebuild-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Linux executable and forensic rebuild receipts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-focused-${{ matrix.os }}-${{ github.sha }}
          path: |
            qualification/mcr-r8/target/release/mcr-ingest
            qualification/mcr-r8/repro-first-mcr-ingest
            qualification/mcr-r8/repro-second-mcr-ingest
            qualification/mcr-r8/qualification-receipt.json
            qualification/mcr-r8/clean-rebuild-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  authority-schema:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qualification/mcr-r8
    steps:
      - name: Check out synthetic-only public qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record Python and SQLite versions
        run: |
          python --version
          python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Execute append-only authority-schema qualification
        run: python tests/test_authority_schema.py
