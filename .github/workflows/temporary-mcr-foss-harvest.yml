name: Temporary MCR public FOSS active-stack harvest

on:
  push:
    branches:
      - temporary/mcr-foss-harvest-20260904
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-foss-harvest-20260904
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out temporary public-source controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire, verify, licence-inventory and package active FOSS stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/temporary_mcr_foss_harvest.py

      - name: Upload single controlled harvest ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-github-foss-active-stack-harvest-r1
          path: |
            harvest-output/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip
            harvest-output/OUTER_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Fail closed on required acquisition gaps
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('harvest-work/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04/CONTROL/HARVEST_RESULT.json')
          if not p.exists():
              raise SystemExit('Harvest result missing')
          data=json.loads(p.read_text())
          print('Required failures:', len(data['required_failures']))
          for item in data['required_failures']:
              print(json.dumps(item, sort_keys=True))
          if data['required_failures']:
              sys.exit(2)
          PY
