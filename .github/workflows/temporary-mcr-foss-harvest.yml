name: Temporary MCR public FOSS active-stack harvest

on:
  push:
    branches:
      - temporary/mcr-foss-harvest-20260904
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-foss-harvest-20260904
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out temporary public-source controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Apply confirmed actionlint Windows asset correction
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('controls/mcr_foss_active_stack_manifest.json')
          data=json.loads(p.read_text())
          for item in data['windows_release_assets']:
              if item['component'] == 'actionlint':
                  item['asset_regex'] = r'^actionlint_1\.7\.12_windows_amd64\.zip$'
                  item['correction_note'] = 'Confirmed from exact v1.7.12 GitHub release asset list.'
          p.write_text(json.dumps(data, indent=2))
          PY

      - name: Acquire, verify, licence-inventory and package active FOSS stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/temporary_mcr_foss_harvest.py

      - name: Split the controlled ZIP for connector-safe retrieval
        if: always()
        run: |
          mkdir -p harvest-output/parts
          split -b 350M -d -a 2 --additional-suffix=.part \
            harvest-output/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip \
            harvest-output/parts/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip.
          sha256sum harvest-output/parts/*.part > harvest-output/parts/PARTS_SHA256.txt

      - name: Upload harvest part 00
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-harvest-r1-part00
          path: harvest-output/parts/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip.00.part
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload harvest part 01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-harvest-r1-part01
          path: harvest-output/parts/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip.01.part
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload harvest part 02
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-harvest-r1-part02
          path: harvest-output/parts/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04.zip.02.part
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload harvest integrity controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-harvest-r1-controls
          path: |
            harvest-output/OUTER_SHA256.txt
            harvest-output/parts/PARTS_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Fail closed on required acquisition gaps
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('harvest-work/MCR_GITHUB_FOSS_ACTIVE_STACK_HARVEST_R1_2026-09-04/CONTROL/HARVEST_RESULT.json')
          if not p.exists():
              raise SystemExit('Harvest result missing')
          data=json.loads(p.read_text())
          print('Required failures:', len(data['required_failures']))
          for item in data['required_failures']:
              print(json.dumps(item, sort_keys=True))
          if data['required_failures']:
              sys.exit(2)
          PY
