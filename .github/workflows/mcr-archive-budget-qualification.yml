name: mcr-archive-budget-qualification

on:
  pull_request:
    paths:
      - 'qualifications/mcr-archive-budget/**'
      - '.github/workflows/mcr-archive-budget-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qualifications/mcr-archive-budget
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: rustfmt check
        run: cargo fmt --check
      - name: cargo check
        run: cargo check
      - name: unit and hostile-fixture tests
        run: cargo test --all-targets --verbose
      - name: strict clippy
        run: cargo clippy --all-targets -- -D warnings
