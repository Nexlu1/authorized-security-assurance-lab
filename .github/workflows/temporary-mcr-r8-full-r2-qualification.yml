name: Temporary MCR R8 full R2 qualification

on:
  push:
    branches:
      - temporary/mcr-r8-full-r2-qualification-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-r8-full-r2-qualification-20260905
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  SOURCE_DATE_EPOCH: "0"

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out temporary synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Verify and extract exact R2 source checkpoint
        run: >-
          python qualification/mcr-r8-full-r2/prepare_source.py
          --source-zip qualification/mcr-r8-full-r2/MCR_INGEST_R2_GITHUB_FOSS_PDF_OOXML_SOURCE_CHECKPOINT_2026-09-04.zip
          --out qualification/mcr-r8-full-r2/project

      - name: Static source QA
        working-directory: qualification/mcr-r8-full-r2/project
        run: python scripts/STATIC_SOURCE_QA.py

      - name: Record toolchain and generate exact lock
        working-directory: qualification/mcr-r8-full-r2/project
        run: |
          rustc -Vv
          cargo -V
          cargo generate-lockfile
          cargo fetch --locked

      - name: Formatting gate
        working-directory: qualification/mcr-r8-full-r2/project
        run: cargo fmt --check

      - name: Compile and run portable Rust integration tests
        working-directory: qualification/mcr-r8-full-r2/project
        run: cargo test --locked --all-targets --verbose

      - name: Strict Clippy gate
        working-directory: qualification/mcr-r8-full-r2/project
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        working-directory: qualification/mcr-r8-full-r2/project
        run: cargo build --locked --release --verbose

      - name: Portable runtime smoke
        run: >-
          python qualification/mcr-r8-full-r2/run_smoke.py
          --project qualification/mcr-r8-full-r2/project

      - name: Upload portable qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-full-r2-portable-${{ matrix.os }}-${{ github.sha }}
          path: |
            qualification/mcr-r8-full-r2/project/Cargo.lock
            qualification/mcr-r8-full-r2/project/STATIC_SOURCE_QA_RESULT.json
            qualification/mcr-r8-full-r2/project/qualification_out/source-prepare-receipt.json
            qualification/mcr-r8-full-r2/project/qualification_out/portable-smoke-receipt.json
            qualification/mcr-r8-full-r2/project/target/release/mcr-ingest*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-pdf-specialists:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - name: Check out temporary synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Verify and extract exact R2 source checkpoint
        run: >-
          python qualification/mcr-r8-full-r2/prepare_source.py
          --source-zip qualification/mcr-r8-full-r2/MCR_INGEST_R2_GITHUB_FOSS_PDF_OOXML_SOURCE_CHECKPOINT_2026-09-04.zip
          --out qualification/mcr-r8-full-r2/project

      - name: Execute exact Windows R2 qualification harness
        shell: pwsh
        working-directory: qualification/mcr-r8-full-r2/project
        run: ./scripts/RUN_WINDOWS_QUALIFICATION.ps1 -SkipPrerequisiteInstall

      - name: Upload specialist qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-full-r2-specialists-${{ matrix.os }}-${{ github.sha }}
          path: |
            qualification/mcr-r8-full-r2/project/Cargo.lock
            qualification/mcr-r8-full-r2/project/qualification_out/**
            qualification/mcr-r8-full-r2/project/target/release/mcr-ingest.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
