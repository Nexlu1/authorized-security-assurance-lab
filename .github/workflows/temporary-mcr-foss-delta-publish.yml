      - name: Upload delta part 15
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-foss-delta-r1-published-part15
          path: harvest-output/MCR_FOSS_DELTA_R1_PART_15.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Fail closed on required source acquisition gaps
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('harvest-work/MCR_GITHUB_FOSS_DELTA_R1_2026-09-05/CONTROL/HARVEST_RESULT.json')
          if not path.exists():
              raise SystemExit('Harvest result missing')
          result = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'requested_sources': result['requested_sources'],
              'downloaded_sources': result['downloaded_sources'],
              'required_failure_count': len(result['required_failures']),
              'license_evidence_open_count': result['license_evidence_open_count'],
          }, indent=2))
          for failure in result['required_failures']:
              print(json.dumps(failure, sort_keys=True))
          if result['required_failures']:
              sys.exit(2)
          PY
