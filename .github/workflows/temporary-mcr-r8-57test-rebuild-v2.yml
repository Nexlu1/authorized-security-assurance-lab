name: Temporary MCR R8 exact 57-test Windows rebuild v2

on:
  push:
    branches:
      - temporary/mcr-r8-57test-rebuild-20260905
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-mcr-r8-57test-rebuild-v2-20260905
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out synthetic-only qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Build and execute exact 57-test package
        shell: pwsh
        run: ./qualification/mcr-r8-57/build-package.ps1
      - name: Upload complete tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcr-r8-full-57-v2-${{ matrix.os }}-${{ github.sha }}
          path: ${{ env.MCR_STAGE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
