[package]
name = "mcr-ingest"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Read-only, bounded evidence-file inventory and hostile-state detector for the Master Case Record tooling lane"
repository = ""
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
